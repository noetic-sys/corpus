app = "corpus-temporal-pdf"
primary_region = "iad"

[build]
  dockerfile = "backend/workers/Dockerfile"

[processes]
  worker = "python -m workers.run_temporal_worker --queue pdf-processing-queue"

[env]
  ENVIRONMENT = "production"
  STORAGE_PROVIDER = "s3"

# Dedicated CPU: in-process PDF splitting starves the Temporal heartbeat on shared CPU.
[[vm]]
  size = "performance-1x"
  memory = "2048mb"
