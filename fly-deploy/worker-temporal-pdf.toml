app = "corpus-temporal-pdf"
primary_region = "iad"

[build]
  dockerfile = "backend/workers/Dockerfile"

[processes]
  worker = "python -m workers.run_temporal_worker --queue pdf-processing-queue"

[env]
  ENVIRONMENT = "production"
  STORAGE_PROVIDER = "s3"

# PDF page-splitting is CPU/memory-heavy and runs in-process; on shared-cpu-1x it
# saturates the vCPU and starves the Temporal SDK heartbeat, causing the worker to
# get dropped as a poller ("No workers polling"). Dedicated CPU keeps it connected.
[[vm]]
  size = "performance-1x"
  memory = "2048mb"
