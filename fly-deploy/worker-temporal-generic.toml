app = "corpus-temporal-generic"
primary_region = "iad"

[build]
  dockerfile = "backend/workers/Dockerfile"

[processes]
  worker = "python -m workers.run_temporal_worker --queue generic-extraction-queue"

[env]
  ENVIRONMENT = "production"
  STORAGE_PROVIDER = "s3"

# Generic extraction parses documents (e.g. docx) in-process; on shared-cpu-1x the
# CPU-heavy parse saturates the vCPU and starves the Temporal SDK heartbeat, causing
# the worker to be dropped as a poller ("No workers polling"). Dedicated CPU fixes it.
[[vm]]
  size = "performance-1x"
  memory = "2048mb"
